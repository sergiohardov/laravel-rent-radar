; Limits of the nic.ua NIC-S hosting, see docs/hosting.md.
; They apply to CLI too, so artisan commands hit the same ceiling as cron on the hosting.
memory_limit = 128M
max_execution_time = 60
upload_max_filesize = 2M
post_max_size = 8M

; The app works in UTC (config/app.php); the hosting default is Europe/Kiev.
date.timezone = UTC

; Dev-only: show errors.
display_errors = On
error_reporting = E_ALL
